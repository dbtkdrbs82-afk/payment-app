<!doctype html>
<html lang="ko" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>payment-app</title>

    <title>payment-app</title>

<link rel="manifest" href="/merchant-app.webmanifest" />

<meta name="theme-color" content="#174981" />

<meta
  name="mobile-web-app-capable"
  content="yes"
/>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
/>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
/>

<meta
  name="apple-mobile-web-app-title"
  content="NXG PICK"
/>

<link
  rel="apple-touch-icon"
  href="/pwa-192x192.png"
/>

    <script src="https://payments.korpay.com/js/korpay-sdk.js"></script>
    <script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const path = window.location.pathname

      if (
  (
    path === '/merchant-app' ||
    path.startsWith('/merchant-app/')
  ) &&
  'serviceWorker' in navigator
) {
  window.addEventListener(
    'load',
    () => {
      navigator.serviceWorker
        .register('/merchant-app-sw.js')
        .catch(
          (error) => {
            console.error(
              'NXG 모바일 앱 서비스워커 등록 실패:',
              error
            )
          }
        )
    }
  )
}
    
      if (
        path === '/demo/store' ||
        path === '/demo/store/'
      ) {
        import('/src/demo/store-demo.ts')
      } else if (
        path === '/merchant-app' ||
        path.startsWith('/merchant-app/')
      ) {
        import('/src/merchant-app.ts')
      } else {
        import('/src/main.ts').then(() => {

          if (
            path === '/success' &&
            new URLSearchParams(window.location.search)
              .get('source') === 'kiosk'
          ) {
            // 결제완료 주문만 확인하여 누적 저장
import('/src/nxg-pick-verified-order.ts')
  .then(({ registerVerifiedNxgPickCurrentOrder }) => {
    return registerVerifiedNxgPickCurrentOrder()
  })
  .catch((error) => {
    console.error(
      'NXG PICK 주문 등록 실패:',
      error
    )
    return false
  })
  .then(() => {
    // 기존 주문표는 유지하고 다른 주문 목록만 추가
    return import('/src/nxg-pick-multi-orders.ts')
  })
  .then(({ mountNxgPickMultiOrders }) => {
  mountNxgPickMultiOrders()

  // 다른 가맹점 주문이 있을 때만 상태 확인
  if (document.getElementById('nxg-pick-other-orders')) {
    import('/src/nxg-pick-verified-order.ts')
    .then(({ updateNxgPickOtherOrderStatuses, setupNxgPickOtherOrderAlerts }) => {

setupNxgPickOtherOrderAlerts()

void updateNxgPickOtherOrderStatuses()

        // 5초마다 다른 주문의 준비 상태 갱신
        window.setInterval(() => {
          if (
            document.visibilityState === 'visible' &&
            document.getElementById('nxg-pick-other-orders')
          ) {
            void updateNxgPickOtherOrderStatuses()
          }
        }, 5000)

      })
      .catch((error) => {
        console.error('NXG PICK 주문 상태 갱신 오류:', error)
      })
  }
})

  .catch((error) => {
    console.error(
      'NXG PICK 다중 주문표 연결 실패:',
      error
    )
  })
          }

        })
      }
    </script>
  </body>
</html>
