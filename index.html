    <script src="https://payments.korpay.com/js/korpay-sdk.js"></script>

  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const path = window.location.pathname

      if (
  (
    path === '/merchant-app' ||
    path.startsWith('/merchant-app/')
  ) &&
  'serviceWorker' in navigator
) {
  window.addEventListener(
    'load',
    () => {
      navigator.serviceWorker
        .register('/merchant-app-sw.js')
        .catch(
          (error) => {
            console.error(
              'NXG 모바일 앱 서비스워커 등록 실패:',
              error
            )
          }
        )
    }
  )
}
    
      if (
        path === '/demo/store' ||
        path === '/demo/store/'
      ) {
        import('/src/demo/store-demo.ts')
      } else if (
        path === '/merchant-app' ||
        path.startsWith('/merchant-app/')
      ) {
        import('/src/merchant-app.ts')
      } else {
        import('/src/main.ts')
      }
    </script>
  </body>
</html>
