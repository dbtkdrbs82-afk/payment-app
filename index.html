<!doctype html>
<html lang="ko" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>payment-app</title>
    <script src="https://payments.korpay.com/js/korpay-sdk.js"></script>

  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const path = window.location.pathname
    
      if (
        path === '/merchant-app' ||
        path.startsWith('/merchant-app/')
      ) {
        import('/src/merchant-app.ts')
      } else {
        import('/src/main.ts')
      }
    </script>
  </body>
</html>
